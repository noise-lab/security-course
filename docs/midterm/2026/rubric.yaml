- number: 4
  points: 4.0
  section: Threat Models and Foundations
  text: 'Case study. In 2012 an anonymous researcher logged into hundreds of thousands of home routers that still
    had their factory default passwords, used them to scan the entire Internet, and published the data set (the
    "Carna botnet"). The owners were never asked. Today a graduate student proposes to use the published data set
    to study how address usage has changed since 2012. Using respect for persons, give one argument against the
    original collection; using beneficence, give one argument for the reuse today. p3.15inp3.15in@ Against the collection
    (respect for persons): & For the reuse (beneficence): &'
  parts:
  - kind: short
    grid: true
    label: Against the collection (respect for persons)
    prompt: Against the collection (respect for persons)
    solution: 'The owners'' devices were accessed and modified without informed consent: never asked, never told,
      no way to opt out, so they were treated as means rather than persons.'
    width_in: 3.07
    height_in: 0.94
    id: 4a
    points: 2.0
    criteria:
    - id: c1
      points: 2
      description: 'Valid respect-for-persons argument: owners'' devices accessed without informed consent/knowledge/opt-out,
        treated as means (full credit for one clear argument; 1 if vague)'
  - kind: short
    grid: true
    label: For the reuse (beneficence)
    prompt: For the reuse (beneficence)
    solution: The data already exists and cannot be un-collected; reuse adds no new risk to the owners (decade-old
      address-level data) and the benefit, a baseline for Internet growth, is real; risk against benefit favors
      reuse even though it did not favor collection.
    width_in: 3.07
    height_in: 0.94
    id: 4b
    points: 2.0
    criteria:
    - id: c1
      points: 2
      description: 'Valid beneficence argument for reuse: data already exists, little new risk/harm to owners, real
        benefit (e.g., baseline of Internet address usage); 1 if only benefit or only low risk stated'
