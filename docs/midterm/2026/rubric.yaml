- number: 16
  points: 4.0
  section: Routing Security
  text: In BGPsec, each AS signs an attestation covering the AS path so far and the AS it is sending the announcement
    to. AS 160 originates a prefix and announces it to AS 174, which announces it to AS 15169. Suppose each AS signed
    the path so far but not the AS it was sending the announcement to. What could a dishonest AS 15169 announce
    to its own neighbors that would still pass validation, and why does 160's signature naming 174 prevent it?
  parts:
  - kind: free
    prompt: In BGPsec, each AS signs an attestation covering the AS path so far and the AS it is sending the announcement
      to. AS 160 originates a prefix and announces it to AS 174, which announces it to AS 15169. Suppose each AS
      signed the path so far but not the AS it was sending the announcement to. What could a dishonest AS 15169
      announce to its own neighbors that would still pass validation, and why does 160's signature naming 174 prevent
      it?
    solution: 'Signing only one''s own hop lets AS 15169 drop 174 from the announcement it received and re-announce
      160 then 15169 with the origin''s genuine signature intact: a shorter path with a correct origin, so origin
      validation passes. With the next hop signed, 160''s attestation says "to 174"; a path omitting 174 would need
      160 to have signed "to 15169", which it never did and 15169 cannot forge.'
    height_in: 1.2
    id: '16'
    points: 4.0
    criteria:
    - id: c1
      points: 2
      description: 'Attack: 15169 removes 174 and re-announces path 160→15169 (shorter path) reusing 160''s genuine
        signature, which passes validation'
    - id: c2
      points: 2
      description: 160's signature names 174 as next hop, so a path omitting 174 would need 160 to have signed for
        15169, which it didn't and 15169 can't forge
