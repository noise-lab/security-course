- number: 22
  points: 3.0
  section: Web Privacy
  text: You are not signed in to any account, you have deleted all your cookies, and you use a private-browsing
    window. A tracking script embedded on the sites you visit can still recognize that your visits come from the
    same browser. Explain why or why not.
  parts:
  - kind: yes_no
    prompt: You are not signed in to any account, you have deleted all your cookies, and you use a private-browsing
      window. A tracking script embedded on the sites you visit can still recognize that your visits come from the
      same browser.
    answer: 'yes'
    id: 22a
    points: 1.0
  - kind: free
    prompt: Explain why or why not.
    solution: 'Yes. The script can fingerprint the browser with no stored state: user-agent, fonts, plugins, screen
      size, time zone, canvas rendering combine into a value that is unique or nearly so (one in hundreds of thousands
      in the class demo). It is recomputed on every visit, so deleting cookies and staying signed out does not reset
      it; the tracker can even re-create the cookie.'
    height_in: 1.0
    id: 22b
    points: 2.0
    explains: 22a
    criteria:
    - id: c1
      points: 1
      description: Answers Yes, tracking is still possible
    - id: c2
      points: 1
      description: Browser fingerprinting from attributes (user agent, fonts, screen, canvas, etc.) needs no stored
        state, so clearing cookies/private mode doesn't reset it
