- number: 18
  points: 3.0
  section: Web Security
  text: A web application runs the pseudocode run\_shell("ls " + request.parameter("dir")) when a user requests
    a directory listing. What class of vulnerability is this, and what would an attacker put in the dir parameter
    to make the server run a command of the attacker's choosing? (An English description of the value is fine.)
  parts:
  - kind: free
    prompt: A web application runs the pseudocode run\_shell("ls " + request.parameter("dir")) when a user requests
      a directory listing. What class of vulnerability is this, and what would an attacker put in the dir parameter
      to make the server run a command of the attacker's choosing? (An English description of the value is fine.)
    solution: 'Shell (command) injection: request data is pasted into a command and the shell cannot tell data from
      code. A dir value such as "; <command>" (any separator such as a semicolon or a pipe, followed by the attacker''s
      command: a reverse shell, reading a password file, deleting files) runs ls and then that command with the
      web application''s permissions. Fix: never build commands from strings; allow-list the value or pass it as
      an argument, not through a shell.'
    height_in: 1.15
    id: '18'
    points: 3.0
    criteria:
    - id: c1
      points: 1
      description: Command/shell injection (OS command injection)
    - id: c2
      points: 2
      description: Value containing a separator (; | && etc.) followed by an attacker command, e.g., "; cat /etc/passwd"
