- number: 25
  points: 3.0
  section: DNS Security and Privacy
  text: '[t]0.46 The resolver''s cache entry for google.com has expired; it re-queries the authoritative server
    with transaction ID 0x3a7f, which the off-path attacker cannot see. In the dashed box, write what the attacker
    sends (its content, and how many); below, explain in one sentence why it works. [0.5ex] [t]0.52 solution'
  parts:
  - kind: free
    prompt: Below the figure, explain in one sentence why it works.
    solution: The 16-bit transaction ID is the resolver's only check that a reply is genuine, and the attacker can
      send every ID without seeing the query, so one forged reply matches; if it arrives before the real one it
      is accepted and cached. Credit answers that add source spoofing or the race.
    height_in: 1.4
    id: 25a
    points: 1.5
    criteria:
    - id: why
      points: 1.5
      description: The ID is the only check and can be enumerated without seeing the query, so a matching forged
        reply that beats the real one is cached (accept spoofing / race)
    note: 'Credit what the student wrote in either place: the dashed box on the figure or the answer box below it.
      Content in the other place counts for this part.'
  - kind: free
    figure: kaminsky.png
    grade_from: image
    prompt: In the dashed box on the figure, write what the attacker sends (its content, and how many).
    solution: 'Forged replies saying google.com = the attacker''s address (e.g. 6.6.6.6), one for every transaction
      ID 0x0000-0xffff: 65,536 of them (accept "every possible ID" or "all 2^16"), sent with the authoritative server''s
      address as the source.'
    height_in: null
    id: 25b
    points: 1.5
    criteria:
    - id: content
      points: 0.75
      description: Forged DNS answers mapping google.com to an attacker-controlled address
    - id: count
      points: 0.75
      description: 'One per transaction ID: all 65,536 / every possible 16-bit ID (many guesses earns partial)'
    note: 'Credit what the student wrote in either place: the dashed box on the figure or the answer box below it.
      Content in the other place counts for this part.'
