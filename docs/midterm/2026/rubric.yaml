- number: 12
  points: 4.0
  section: Denial of Service
  text: To stop a denial-of-service attack coming from one region, campus IT installs a firewall at the edge of
    the network that inspects every incoming connection and drops the attack traffic. Deploying the firewall has
    introduced a new denial-of-service vulnerability. Explain why or why not.
  parts:
  - kind: yes_no
    prompt: To stop a denial-of-service attack coming from one region, campus IT installs a firewall at the edge
      of the network that inspects every incoming connection and drops the attack traffic. Deploying the firewall
      has introduced a new denial-of-service vulnerability.
    answer: 'yes'
    id: 12a
    points: 1.0
  - kind: free
    prompt: Explain why or why not.
    solution: Yes. The firewall has finite memory and CPU, and every packet, including all the attack traffic, must
      now pass through it and be inspected. Enough traffic exhausts its state table or CPU, and when it fails nobody
      gets through, so the appliance added to stop the attack is the new, easier target. Any device placed in front
      of a service becomes the next finite resource to exhaust.
    height_in: 1.0
    id: 12b
    points: 3.0
    explains: 12a
    criteria:
    - id: c1
      points: 1
      description: Answers Yes, the firewall introduces a new DoS vulnerability
    - id: c2
      points: 2
      description: 'Reason: firewall has finite CPU/memory/state, all traffic passes through and is inspected, so
        it can be exhausted and then blocks everyone (new bottleneck/single point of failure)'
- number: 13
  points: 4.0
  section: Denial of Service
  text: A new chat service allocates a 64 KB message buffer for every connection request the moment it arrives,
    before the client has sent anything else. Describe one way an attacker exploits this, and redesign the protocol
    in the spirit of SYN cookies so that the attack no longer works. A sentence or two of design is enough; no cryptographic
    detail is needed.
  parts:
  - kind: free
    prompt: A new chat service allocates a 64 KB message buffer for every connection request the moment it arrives,
      before the client has sent anything else. Describe one way an attacker exploits this, and redesign the protocol
      in the spirit of SYN cookies so that the attack no longer works. A sentence or two of design is enough; no
      cryptographic detail is needed.
    solution: 'Exploit: flood the server with connection requests from spoofed or throwaway sources and never follow
      up; each costs the attacker one small packet and the server 64 KB, so memory runs out first. Redesign: do
      no work on the first packet; reply with a small cookie derived from the client''s address and a secret, and
      allocate the buffer only when the client returns it, proving it is real and reachable. The client spends effort
      before the server does.'
    height_in: 1.1
    id: '13'
    points: 4.0
    criteria:
    - id: c1
      points: 2
      description: 'Exploit: flood of connection requests (spoofed/never completed) each making server allocate
        64 KB, exhausting memory'
    - id: c2
      points: 2
      description: 'Redesign: allocate nothing on first packet; return a stateless cookie (derived from client address
        and secret) and allocate only when the client echoes it'
