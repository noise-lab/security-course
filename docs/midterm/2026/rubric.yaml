- number: 6
  points: 4.0
  section: Key Management and Public Key Infrastructure
  text: The first time you connect to a new server with SSH, the client shows a key fingerprint and asks whether
    to trust it. Explain how Mallory, on the network path, mounts a man-in-the-middle attack on that first connection,
    and what a careful user must do to defeat it.
  parts:
  - kind: free
    prompt: The first time you connect to a new server with SSH, the client shows a key fingerprint and asks whether
      to trust it. Explain how Mallory, on the network path, mounts a man-in-the-middle attack on that first connection,
      and what a careful user must do to defeat it.
    solution: 'The client has no prior key, so Mallory intercepts the connection, presents her own key and fingerprint,
      and connects onward to the real server as the client; she shares one session key with each side and reads
      and re-encrypts everything. Defeat: confirm the fingerprint out of band over a channel Mallory does not control
      (the admin''s web page, a phone call, a key published in advance); afterwards known-hosts pins the key.'
    height_in: 1.0
    id: '6'
    points: 4.0
    criteria:
    - id: c2
      points: 2.0
      description: Mallory intercepts, presents her own key/fingerprint, and relays to the real server, with separate
        session keys so she reads/modifies traffic
    - id: c3
      points: 2.0
      description: 'Defense: verify fingerprint out of band via a channel Mallory doesn''t control (phone, admin''s
        page, pre-published key)'
    note: 'The question asks how the attack works and what the user must do. That the client has no prior key is
      context: do not require it.'
- number: 7
  points: 4.0
  section: Key Management and Public Key Infrastructure
  text: In Assignment 1 you captured your own HTTPS traffic with Wireshark and served your site with a self-signed
    certificate. p3.15inp3.15in@ (a) Even though the payload was encrypted, name two things an on-path eavesdropper
    could still learn from an HTTPS connection like the one you captured. & (b) The browser warned about your self-signed
    certificate until you took one step. What was it, and what could someone who performed that same step on your
    laptop without your knowledge then do to your other HTTPS traffic? &
  parts:
  - kind: short
    grid: true
    label: (a) Even though the payload was encrypted, name two things an on-path eavesdropper could still learn
      from an HTTPS connection like the one you captured.
    prompt: (a) Even though the payload was encrypted, name two things an on-path eavesdropper could still learn
      from an HTTPS connection like the one you captured.
    solution: 'Visible: SNI in the ClientHello; the server''s and client''s IP addresses; sizes and timing of records;
      the preceding DNS query. Any two.'
    width_in: 3.07
    height_in: 0.94
    id: 7a
    points: 2.0
    criteria:
    - id: c1
      points: 2
      description: 'Two valid items visible to eavesdropper: SNI/hostname, IP addresses, packet sizes/timing, DNS
        query (1 point each)'
  - kind: short
    grid: true
    label: (b) The browser warned about your self-signed certificate until you took one step. What was it, and what
      could someone who performed that same step on your laptop without your knowledge then do to your other HTTPS
      traffic?
    prompt: (b) The browser warned about your self-signed certificate until you took one step. What was it, and
      what could someone who performed that same step on your laptop without your knowledge then do to your other
      HTTPS traffic?
    solution: Add the certificate to the machine's (or browser's) trust store, making it a root of trust. Anyone
      who can install a root on your machine can mint a certificate for any site and sit on the path as a man in
      the middle with no browser warning.
    width_in: 3.07
    height_in: 0.94
    id: 7b
    points: 2.0
    criteria:
    - id: c1
      points: 1
      description: 'Step: added/trusted the certificate in the browser or machine trust store (made it a root)'
    - id: c2
      points: 1
      description: Someone with such a root can forge certificates for any site and man-in-the-middle other HTTPS
        traffic without warning
- number: 8
  points: 3.0
  section: Key Management and Public Key Infrastructure
  text: Alice posts her public key in the course Slack channel so people can send her encrypted mail. This solves
    the key-distribution problem for anyone who wants to write to her. Explain why or why not.
  parts:
  - kind: yes_no
    prompt: Alice posts her public key in the course Slack channel so people can send her encrypted mail. This solves
      the key-distribution problem for anyone who wants to write to her.
    answer: 'no'
    id: 8a
    points: 1.0
  - kind: free
    prompt: Explain why or why not.
    solution: No. Anyone who can post as Alice, alter the message, or sit between the reader and the channel can
      substitute their own key, and the reader cannot tell. Distribution needs a trusted binding of identity to
      key (a certificate from a party already trusted, a fingerprint confirmed out of band, a pinned key), not just
      a place to post it.
    height_in: 1.0
    id: 8b
    points: 2.0
    explains: 8a
    criteria:
    - id: c1
      points: 1
      description: 'Answers No: posting the key in Slack doesn''t solve distribution'
    - id: c2
      points: 1
      description: 'Reason: attacker can post as Alice, alter the message, or sit in the path and substitute their
        own key, or no binding of identity to key (needs certificate, out-of-band fingerprint, or pinning)'
    note: 'A student who answered Yes and explains that posting a public key removes the n-squared shared-key part
      of the problem (n key pairs instead of a shared key for every pair) earns 1 of 2: that part is solved, though
      binding the key to Alice is not. A Yes with no such explanation earns nothing extra.'
